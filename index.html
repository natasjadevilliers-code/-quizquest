<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QuizQuest"><link rel="manifest" href="manifest.webmanifest">
<title>QuizQuest</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
main{max-width:760px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px 40px}
.card{background:#151d31;border:1px solid #334155;border-radius:22px;padding:20px;margin:14px 0}
h1{font-size:38px;margin:8px 0}.muted{color:#bac5d6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px;background:#7c3aed;color:white}
.cat{background:#202a42;text-align:left}.cat.on{outline:3px solid #a78bfa}.answer{width:100%;margin:6px 0;background:#202a42;text-align:left}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.pill{background:#25304a;padding:7px 10px;border-radius:999px}
.flag{font-size:92px;text-align:center;padding:18px}.good{background:#166534!important}.bad{background:#991b1b!important}
.progress{height:9px;background:#263149;border-radius:9px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:#8b5cf6}
.hidden{display:none}.big{font-size:24px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:#202a42;padding:12px;border-radius:14px}.learn{border-left:5px solid #f59e0b;padding:12px;background:#202a42;border-radius:10px}
</style></head><body><main>
<section id="home"><h1>QuizQuest</h1><p class="muted">20 questions per round • learn, test, level up • no repeats until the category bank is exhausted.</p>
<div class="card"><h2>Choose categories</h2><div id="cats" class="grid"></div></div>
<button onclick="startLearn()">Learning round</button> <button onclick="startQuiz()">Start 20-question quiz</button>
<div class="card"><div class="top"><b>Your progress</b><span id="levelHome" class="pill"></span></div><div id="overall"></div></div></section>
<section id="learn" class="hidden card"><div class="top"><b>Learning Round</b><span id="lc" class="pill"></span></div><div id="lcat" class="pill"></div><div id="lflag" class="flag"></div><p id="lq" class="big"></p><div id="learnAnswers"></div><div id="la" class="learn hidden"></div><br><button id="learnNext" class="hidden" onclick="nextLearn()">Next</button> <button onclick="startQuiz()">Quiz me</button></section>
<section id="quiz" class="hidden card"><div class="top"><span id="qc" class="pill"></span><span id="lvl" class="pill"></span><span id="score" class="pill"></span></div><div class="progress"><i id="bar"></i></div><div id="qcat" class="pill"></div><div id="qflag" class="flag"></div><p id="qq" class="big"></p><div id="answers"></div><div id="fb"></div><button id="next" class="hidden" onclick="nextQ()">Next</button></section>
<section id="result" class="hidden card"><h2>Round complete 🎉</h2><div class="stats"><div><b id="rs"></b><br>Correct</div><div><b id="rp"></b><br>Score</div><div><b id="rl"></b><br>Level</div></div><p id="msg"></p><button id="mistakeBtn" class="hidden" onclick="startMistakes()">Study my mistakes</button> <button onclick="startQuiz()">Next round</button> <button onclick="home()">Categories</button></section>
<section id="mistakes" class="hidden card"><div class="top"><b>Study My Mistakes</b><span id="mc" class="pill"></span></div><div class="progress"><i id="mbar"></i></div><div id="mcat" class="pill"></div><div id="mflag" class="flag"></div><p id="mq" class="big"></p><div id="manswers"></div><div id="mfb"></div><button id="mnext" class="hidden" onclick="nextMistake()">Next</button></section>
<script src="questions.js"></script><script>
const S=JSON.parse(localStorage.getItem('qq2')||'{"xp":0,"used":{}}');let selected=new Set(Object.keys(QUESTION_BANK)),deck=[],idx=0,score=0,learnDeck=[],li=0,mistakes=[],midx=0;
const $=x=>document.getElementById(x), save=()=>localStorage.setItem('qq2',JSON.stringify(S));
function level(){return Math.floor(S.xp/100)+1} function show(id){['home','learn','quiz','result','mistakes'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function init(){for(const c of Object.keys(QUESTION_BANK)){let b=document.createElement('button');b.className='cat on';b.textContent=c+' ('+QUESTION_BANK[c].length+')';b.onclick=()=>{selected.has(c)?selected.delete(c):selected.add(c);b.classList.toggle('on')};$('cats').appendChild(b)}updateHome()}
function updateHome(){$('levelHome').textContent='Level '+level()+' • '+S.xp+' XP';$('overall').textContent='Every correct answer earns 5 XP. Every 100 XP advances a level.'}
function pool(){let p=[];for(const c of selected){QUESTION_BANK[c].forEach((q,i)=>p.push({...q,cat:c,key:c+'|'+i}))}return p}
function fresh(n){let p=pool().filter(q=>!S.used[q.key]);if(p.length<n){for(const c of selected)Object.keys(S.used).filter(k=>k.startsWith(c+'|')).forEach(k=>delete S.used[k]);p=pool().filter(q=>!S.used[q.key])}return p.sort(()=>Math.random()-.5).slice(0,n)}
function startLearn(){if(!selected.size)return alert('Choose a category');learnDeck=fresh(20);li=0;show('learn');renderLearn()}
function renderLearn(){if(li>=learnDeck.length)return startQuiz();let q=learnDeck[li];$('lc').textContent=(li+1)+'/20';$('lcat').textContent=q.cat;$('lflag').textContent=q.flag||'';$('lq').textContent=q.q;$('la').classList.add('hidden');$('learnNext').classList.add('hidden');$('learnAnswers').innerHTML='';q.a.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>guessLearn(i,b);$('learnAnswers').appendChild(b)})}
function guessLearn(i,b){let q=learnDeck[li];[...$('learnAnswers').children].forEach(x=>x.disabled=true);if(i===q.correct)b.classList.add('good');else{b.classList.add('bad');$('learnAnswers').children[q.correct].classList.add('good')}$('la').innerHTML='<b>Answer:</b> '+q.a[q.correct]+'<br><span class="muted">'+q.fact+'</span>';$('la').classList.remove('hidden');$('learnNext').classList.remove('hidden')}
function nextLearn(){li++;renderLearn()}
function startQuiz(){if(!selected.size)return alert('Choose a category');deck=fresh(20);idx=0;score=0;mistakes=[];show('quiz');renderQ()}
function renderQ(){if(idx>=deck.length)return finish();let q=deck[idx];$('qc').textContent=(idx+1)+'/20';$('lvl').textContent='Level '+level();$('score').textContent='Score '+score;$('bar').style.width=((idx)/20*100)+'%';$('qcat').textContent=q.cat;$('qflag').textContent=q.flag||'';$('qq').textContent=q.q;$('fb').innerHTML='';$('next').classList.add('hidden');$('answers').innerHTML='';q.a.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>answer(i,b);$('answers').appendChild(b)})}
function answer(i,b){let q=deck[idx];[...$('answers').children].forEach(x=>x.disabled=true);let ok=i===q.correct;if(ok){score++;S.xp+=5;b.classList.add('good')}else{mistakes.push(q);b.classList.add('bad');$('answers').children[q.correct].classList.add('good')}S.used[q.key]=1;save();$('fb').innerHTML='<p class="'+(ok?'':'muted')+'">'+(ok?'Correct! ✅ ':'Not quite. ')+q.fact+'</p>';$('next').classList.remove('hidden')}
function nextQ(){idx++;renderQ()}function finish(){show('result');let pct=Math.round(score/20*100);$('rs').textContent=score+'/20';$('rp').textContent=pct+'%';$('rl').textContent=level();$('msg').textContent=mistakes.length?('You missed '+mistakes.length+' question'+(mistakes.length===1?'':'s')+'. Use Study My Mistakes to answer only those again.'):'Perfect round — no mistakes to study!';$('mistakeBtn').classList.toggle('hidden',mistakes.length===0);updateHome()}
function startMistakes(){midx=0;show('mistakes');renderMistake()}
function renderMistake(){if(midx>=mistakes.length){show('result');$('msg').textContent='Mistake review complete. You worked back through every question you missed in that round.';$('mistakeBtn').classList.add('hidden');return}let q=mistakes[midx];$('mc').textContent=(midx+1)+'/'+mistakes.length;$('mbar').style.width=((midx)/mistakes.length*100)+'%';$('mcat').textContent=q.cat;$('mflag').textContent=q.flag||'';$('mq').textContent=q.q;$('mfb').innerHTML='';$('mnext').classList.add('hidden');$('manswers').innerHTML='';q.a.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>answerMistake(i,b);$('manswers').appendChild(b)})}
function answerMistake(i,b){let q=mistakes[midx];[...$('manswers').children].forEach(x=>x.disabled=true);let ok=i===q.correct;if(ok)b.classList.add('good');else{b.classList.add('bad');$('manswers').children[q.correct].classList.add('good')}$('mfb').innerHTML='<p>'+(ok?'Correct this time! ✅ ':'Not quite yet. ')+q.fact+'</p>';$('mnext').classList.remove('hidden')}
function nextMistake(){midx++;renderMistake()}
function home(){show('home');updateHome()}init();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></main></body></html>
